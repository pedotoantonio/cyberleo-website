# cyberleo.it — nginx config (container nginx:alpine o host nginx Ubuntu)
#
# Cosa fa:
#   1. Compressione gzip (e brotli se modulo presente)
#   2. Security headers: HSTS, CSP, X-Frame, X-CT-Opts, Referrer-Policy, Permissions-Policy
#   3. Caching aggressivo su /assets/* (hash nel filename) + no-cache su HTML/manifest
#   4. Bot-detection: i crawler social (Facebook, WhatsApp, Telegram, LinkedIn,
#      Twitter, Slack, Discord, Skype, Pinterest, …) vedono /prerendered/<path>/index.html
#      con title/og/JSON-LD specifici per ogni URL. Utenti veri continuano a vedere la SPA.
#   5. SPA fallback (try_files → /index.html) per la React app
#
# NOTA: il blocco `map` va nel context `http` di nginx. In conf.d/ di nginx:alpine
# funziona perché il file principale lo include sotto `http {}`. Su host Ubuntu
# verifica che il file sia incluso da nginx.conf (default per /etc/nginx/conf.d/*.conf).

map $http_user_agent $is_social_bot {
    default                                 0;
    "~*facebookexternalhit"                 1;
    "~*facebookcatalog"                     1;
    "~*Facebot"                             1;
    "~*Twitterbot"                          1;
    "~*LinkedInBot"                         1;
    "~*WhatsApp"                            1;
    "~*TelegramBot"                         1;
    "~*Slackbot"                            1;
    "~*Slack-ImgProxy"                      1;
    "~*Discordbot"                          1;
    "~*Pinterest"                           1;
    "~*SkypeUriPreview"                     1;
    "~*redditbot"                           1;
    "~*Embedly"                             1;
    "~*vkShare"                             1;
    "~*W3C_Validator"                       1;
    "~*Applebot"                            1;
    "~*Bingbot"                             1;
    "~*DuckDuckBot"                         1;
    "~*YandexBot"                           1;
    "~*Baiduspider"                         1;
    "~*Iframely"                            1;
    "~*LinkPreview"                         1;
    # Google rende JS bene → lasciamogli la SPA per non perdere "rich indexing"
    "~*GoogleOther"                         0;
    "~*Googlebot"                           0;
}

server {
    listen 80;
    server_name localhost cyberleo.it www.cyberleo.it;
    root /usr/share/nginx/html;
    index index.html;

    # ────────────────────────────────────────────────────────────────────
    # Compression
    # ────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/xml+rss
        application/manifest+json application/ld+json
        image/svg+xml font/ttf font/otf application/font-woff application/font-woff2;

    # Brotli — attiva queste righe SOLO se nginx ha il modulo brotli compilato
    # (nginx:alpine NON lo ha di default; nginx-extras su Ubuntu sì).
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types
    #     text/plain text/css text/xml text/javascript
    #     application/javascript application/json application/xml
    #     application/manifest+json application/ld+json
    #     image/svg+xml;

    # ────────────────────────────────────────────────────────────────────
    # Security headers a livello server (per le location che NON ne hanno di propri)
    # nginx NON eredita add_header se la location ne ha già uno → vedi include
    # /etc/nginx/conf.d/security-headers.conf nelle location specifiche.
    # ────────────────────────────────────────────────────────────────────
    include /etc/nginx/conf.d/security-headers.conf;

    # ────────────────────────────────────────────────────────────────────
    # 1) Crawler social → HTML pre-renderizzato dedicato
    # ────────────────────────────────────────────────────────────────────
    location / {
        if ($is_social_bot = 1) {
            rewrite ^/$ /prerendered/index.html last;
            rewrite ^(/[^.]+?)/?$ /prerendered$1/index.html last;
        }
        try_files $uri $uri/ /index.html;
    }

    location /prerendered/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # ────────────────────────────────────────────────────────────────────
    # 2) Assets immutabili (hash nel nome → cache 1 anno)
    # ────────────────────────────────────────────────────────────────────
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(woff2?|ttf|otf|eot)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    location ~* \.(png|jpe?g|gif|webp|avif|ico|svg)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ────────────────────────────────────────────────────────────────────
    # 3) HTML / manifest / service worker → mai cache
    # ────────────────────────────────────────────────────────────────────
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /robots.txt {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /sitemap.xml {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ────────────────────────────────────────────────────────────────────
    # 4) Backend proxy
    # ────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://host.docker.internal:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
